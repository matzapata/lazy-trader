[package]
name = "lt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cli"                
path = "src/presentation/cli/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.74"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "signal"] }
thiserror = "1.0"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
indicatif = "0.17.7"
console = "0.15.7"
prettytable-rs = "^0.10"
colored = "3.0.0"
dirs = "6.0.0"
chrono = "0.4.31"
ta = "0.4.0"
terminal_size = "0.4.1"
